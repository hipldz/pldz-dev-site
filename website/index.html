<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hi 爬楼的猪</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500..600&amp;family=Manrope:wght@400..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,-25..0&amp;display=swap"
    />

    <script>
      (() => {
        const allowedThemes = new Set(["light", "dark"]);
        let theme = "light";

        try {
          const storedTheme = window.localStorage.getItem("pldz-dev-theme");
          if (allowedThemes.has(storedTheme)) theme = storedTheme;
          else if (["gemini", "lime", "gpt", "brown", "claude"].includes(storedTheme)) theme = "light";
        } catch (_error) {}

        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <style>
      #loading {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: var(--app-bg, #f8f9fd);
      }
      #loading > div {
        width: min(80vw, 400px);
        text-align: center;
      }
      #text {
        margin: 0 0 12px;
        font:
          600 13px Manrope,
          system-ui,
          sans-serif;
        color: var(--app-text, #20232d);
      }
      #track {
        height: 4px;
        background: var(--app-surface-sunken, #eef1f6);
        border-radius: 999px;
        overflow: hidden;
      }
      #bar {
        width: 0;
        height: 100%;
        background: linear-gradient(90deg, #4f72bf, #6f91c8, #78a7cf);
        transition: width 0.2s ease;
      }
    </style>
  </head>

  <body>
    <!-- loading -->
    <div id="loading">
      <div>
        <div id="text">Loading 0%</div>
        <div id="track"><div id="bar"></div></div>
      </div>
    </div>

    <!-- app -->
    <div id="app"></div>

    <script>
      (() => {
        const bar = document.getElementById("bar");
        const text = document.getElementById("text");
        let p = 0;

        const set = (n) => {
          p = Math.max(0, Math.min(100, n));
          bar.style.width = p + "%";
          text.textContent = `Loading ${p}%`;
        };

        const timer = setInterval(() => {
          if (p < 95) set(p + 1);
          else clearInterval(timer);
        }, 60);

        window.loading = {
          set,
          done() {
            clearInterval(timer);
            set(100);
            document.getElementById("loading")?.remove();
          },
        };
      })();
    </script>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
